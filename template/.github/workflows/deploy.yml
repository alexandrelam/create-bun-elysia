name: Deploy

# Every commit that lands on main is deployed. `workflow_dispatch` re-runs the
# same deploy by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A newer commit waits for the running deploy to finish
# rather than cancelling it, so the server is never left mid-build.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Check required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=()
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}. See .github/workflows/README-deploy.md"
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run update.sh on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          APP_DIR: ${{ vars.APP_DIR || '~/projects/__APP_NAME__' }}
          BRANCH: ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail; cd $APP_DIR && ./update.sh --branch '$BRANCH'"

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/id_deploy
